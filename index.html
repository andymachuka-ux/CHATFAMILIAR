<!-- ========================================== -->
<!-- 1. BOTÓN Y BANNER (Pégalo debajo de tu selector de canal) -->
<!-- ========================================== -->
<div style="margin: 12px 0; text-align: center;">
    <!-- Botón de aviso -->
    <button id="btnAvisarCena" onclick="avisarCena()" style="
        background-color: #d9534f; 
        color: white; 
        border: none; 
        padding: 12px 20px; 
        border-radius: 8px; 
        font-size: 15px;
        font-weight: bold; 
        cursor: pointer;
        width: 100%;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    ">
        🍲 ¡Ya esta la cena!
    </button>
</div>

<!-- Banner de alerta en rojo -->
<div id="bannerCena" style="
    display: none; 
    background-color: #d9534f; 
    color: white; 
    padding: 14px; 
    border-radius: 8px; 
    margin-bottom: 12px; 
    text-align: center; 
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
">
    🚨 ¡YA ESTA LA CENA!
</div>


<!-- ========================================== -->
<!-- 2. LÓGICA DE FIREBASE (Pégalo en tu sección de Scripts JS) -->
<!-- ========================================== -->
<script>
// Función al presionar el botón
function avisarCena() {
    // Activa la señal en la base de datos en tiempo real
    firebase.database().ref('sistema/aviso_cena').set({
        activo: true,
        timestamp: Date.now()
    });

    // Se apaga automáticamente la alerta visual en los teléfonos después de 20 segundos
    setTimeout(() => {
        firebase.database().ref('sistema/aviso_cena').set({ activo: false });
    }, 20000);
}

// Escuchador en tiempo real para todos los dispositivos conectados
firebase.database().ref('sistema/aviso_cena').on('value', (snapshot) => {
    const data = snapshot.val();
    const banner = document.getElementById('bannerCena');
    
    if (banner) {
        if (data && data.activo) {
            banner.style.display = 'block';
            
            // Hace vibrar el celular si el dispositivo lo soporta
            if (navigator.vibrate) {
                navigator.vibrate([300, 150, 300, 150, 300]);
            }
        } else {
            banner.style.display = 'none';
        }
    }
});
</script>
