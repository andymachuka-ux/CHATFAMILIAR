<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat y Ubicación Familiar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; color: #e9edef; }
        .gps-status { font-size: 0.75rem; color: #00a884; display: flex; align-items: center; gap: 4px; }
        .gps-dot { width: 8px; height: 8px; background-color: #00a884; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 24px 24px; }
        .message { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .meta { font-size: 0.65rem; color: #8696a0; text-align: right; margin-top: 4px; }
        .location-card { background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; margin-top: 6px; border-left: 3px solid #00a884; }
        .location-link { color: #53bdeb; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 4px; font-size: 0.85rem; }
        footer { background-color: #202c33; padding: 10px; display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; background-color: #2a3942; border: none; padding: 12px 16px; border-radius: 8px; color: #e9edef; font-size: 0.95rem; outline: none; }
        button { background-color: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; color: #111b21; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
    <!-- Módulos de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <div class="user-info">
            <span class="user-name" id="display-name">OPERATIVO</span>
            <span class="gps-status"><div class="gps-dot"></div> Rastreando en tiempo real</span>
        </div>
    </header>

    <div id="chat-container"></div>

    <footer>
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">➤</button>
    </footer>

    <script>
        // Configuración de base de datos en tiempo real pública (Firebase de prueba)
        const firebaseConfig = {
            databaseURL: "https://chat-familiar-default-rtdb.firebaseio.com"
        };
        
        // Si no está inicializado, usar un almacén público para sincronizar rápido
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const chatRef = database.ref("mensajes_familia");

        let userName = localStorage.getItem('chat_username');
        if (!userName) {
            userName = prompt("Ingresa tu nombre para el grupo familiar:") || "Familiar";
            localStorage.setItem('chat_username', userName);
        }
        document.getElementById('display-name').innerText = userName;

        let currentCoords = null;

        // Rastreo constante de GPS por defecto
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                },
                (error) => { console.error("Error GPS:", error); },
                { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
            );
        }

        // Enviar mensaje a la nube
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const newMsgRef = chatRef.push();
            newMsgRef.set({
                autor: userName,
                texto: text,
                coords: currentCoords,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Recibir mensajes en tiempo real de cualquier teléfono a la distancia
        chatRef.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const isOutgoing = data.autor === userName;
            addMessageToDOM(data.autor, data.texto, isOutgoing, data.coords, data.timestamp);
        });

        function addMessageToDOM(author, text, isOutgoing, coords, time) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

            let html = `<strong>${author}</strong><br>${text}`;
            if (coords) {
                const mapsUrl = `https://www.google.com/maps?q=${coords.lat},${coords.lng}`;
                html += `
                    <div class="location-card">
                        📍 Ubicación GPS enviada
                        <br>
                        <a href="${mapsUrl}" target="_blank" class="location-link">Ver en mapa</a>
                    </div>
                `;
            }
            html += `<div class="meta">${time}</div>`;

            msgDiv.innerHTML = html;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
