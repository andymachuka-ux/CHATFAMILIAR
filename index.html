<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatfamiliar</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b141a; color: #e9edef; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #202c33; padding: 10px 15px; display: flex; flex-direction: column; border-bottom: 1px solid #2f3b43; }
        header h2 { margin: 0; font-size: 16px; color: #e9edef; }
        .status-header { font-size: 11px; color: #00a884; margin-top: 3px; font-weight: normal; }
        
        /* BARRA DE SELECCIÓN DE CHAT */
        .chat-selector { background-color: #111b21; padding: 8px 15px; border-bottom: 1px solid #2f3b43; display: flex; align-items: center; gap: 10px; }
        .chat-selector label { font-size: 12px; color: #8696a0; font-weight: bold; }
        .chat-selector select { background-color: #2a3942; color: #e9edef; border: 1px solid #00a884; border-radius: 12px; padding: 5px 10px; font-size: 13px; outline: none; flex: 1; }
        
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 7.5px; position: relative; word-wrap: break-word; font-size: 14px; }
        .incoming { background-color: #202c33; align-self: flex-start; }
        .outgoing { background-color: #005c4b; align-self: flex-end; }
        .author { font-weight: bold; font-size: 12px; color: #00a884; margin-bottom: 2px; }
        .time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 4px; }
        footer { background-color: #202c33; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; background-color: #2a3942; color: #e9edef; outline: none; font-size: 14px; }
        button { background-color: #00a884; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        a.map-link { color: #53bdeb; text-decoration: underline; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <h2 id="display-name">chatfamiliar</h2>
        <div id="status-display" class="status-header">Conectando...</div>
    </header>

    <!-- MENU DESPLEGABLE DE CHATS -->
    <div class="chat-selector">
        <label for="select-chat">Canal:</label>
        <select id="select-chat" onchange="cambiarCanal()">
            <option value="general">🌐 Grupo General</option>
            <option value="privado_mama">🔒 Privado con Mamá</option>
            <option value="privado_hermano">🔒 Privado con Hermano</option>
        </select>
    </div>

    <div id="chat-container"></div>

    <footer>
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="send-btn">&#10148;</button>
    </footer>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            databaseURL: "https://chatfamilia-386df-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let currentRef = null;
        let activeChannel = 'general';

        // Manejo de Nombre de Usuario local
        let userName = localStorage.getItem('chat_username');
        if (!userName) {
            userName = prompt("Ingresa tu nombre para el grupo familiar:") || "Familiar";
            localStorage.setItem('chat_username', userName);
        }
        document.getElementById('display-name').innerText = userName;

        // --- SISTEMA DE PRESENCIA ---
        const userStatusRef = database.ref('/presencia/' + userName);
        const connectedRef = database.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().set({
                    online: false,
                    lastChanged: firebase.database.ServerValue.TIMESTAMP
                });
                userStatusRef.set({
                    online: true,
                    lastChanged: firebase.database.ServerValue.TIMESTAMP
                });
            }
        });

        database.ref('/presencia/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            let statusText = [];
            for (let user in data) {
                if (user !== userName) {
                    const status = data[user];
                    if (status.online) {
                        statusText.push(`🟢 ${user}: En línea`);
                    } else if (status.lastChanged) {
                        const timeStr = new Date(status.lastChanged).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        statusText.push(`🔴 ${user}: últ. vez ${timeStr}`);
                    }
                }
            }
            
            const statusDiv = document.getElementById('status-display');
            statusDiv.innerText = statusText.length > 0 ? statusText.join(' | ') : 'Esperando a otros familiares...';
        });

        // --- GESTIÓN DE CANALES Y MENSAJES ---
        function cambiarCanal() {
            activeChannel = document.getElementById('select-chat').value;
            document.getElementById('chat-container').innerHTML = ''; // Limpiar pantalla
            
            if (currentRef) {
                currentRef.off(); // Detener escucha del canal anterior
            }

            // Definir ruta en Firebase según el canal seleccionado
            if (activeChannel === 'general') {
                currentRef = database.ref('mensajes');
            } else {
                currentRef = database.ref('chats_privados/' + activeChannel);
            }

            escucharMensajes();
        }

        function addMessageToDOM(autor, texto, isOutgoing, coords, timestamp) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            
            let htmlContent = `<div class="author">${autor}</div><div>${texto}</div>`;
            if (coords) {
                htmlContent += `<a class="map-link" href="https://maps.google.com/?q=${coords.lat},${coords.lng}" target="_blank">📍 Ver ubicación GPS en mapa</a>`;
            }
            
            const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            htmlContent += `<div class="time">${timeStr}</div>`;
            
            msgDiv.innerHTML = htmlContent;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const coords = { lat: position.coords.latitude, lng: position.coords.longitude };
                    enviarAFirebase(text, coords);
                }, (error) => {
                    enviarAFirebase(text, null);
                }, { timeout: 10000 });
            } else {
                enviarAFirebase(text, null);
            }
            input.value = '';
        }

        function enviarAFirebase(texto, coords) {
            currentRef.push({
                autor: userName,
                texto: texto,
                coords: coords,
                timestamp: Date.now()
            });
        }

        function escucharMensajes() {
            currentRef.limitToLast(50).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const isOutgoing = data.autor === userName;
                
                addMessageToDOM(data.autor, data.texto, isOutgoing, data.coords, data.timestamp);
                
                if (!isOutgoing) {
                    if (window.Notification && Notification.permission === "granted") {
                        new Notification("Mensaje de " + data.autor, {
                            body: data.texto,
                            icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png"
                        });
                    } else if (window.Notification && Notification.permission !== "denied") {
                        Notification.requestPermission();
                    }
                }
            });
        }

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('message-input').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // Iniciar en el canal General por defecto
        cambiarCanal();
    </script>
</body>
</html>
