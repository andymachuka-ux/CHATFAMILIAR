<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Familiar</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Version Compatibilidad 9.23.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.15s ease;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }

        @keyframes alert-pulse {
            0%, 100% { background-color: #dc2626; box-shadow: 0 0 15px rgba(220, 38, 38, 0.7); transform: scale(1); }
            50% { background-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); transform: scale(1.02); }
        }
        .alert-dinner-active { animation: alert-pulse 1s infinite ease-in-out; }

        /* Animación de 6 destellos rojos seguidos para accesibilidad visual */
        @keyframes flash-six-red {
            0%, 100% { background-color: #0f172a; }
            8%, 25%, 41%, 58%, 75%, 91% { background-color: #dc2626; }
            16%, 33%, 50%, 66%, 83% { background-color: #0f172a; }
        }
        .flash-rojo-activo { animation: flash-six-red 2.4s ease-in-out; }
    </style>
</head>
<body id="bodyApp" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-teal-500 selection:text-white">

    <!-- Encabezado -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 p-4 sticky top-0 z-30 shadow-lg">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-teal-500 text-slate-950 p-2.5 rounded-2xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-house-chimney text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-2xl leading-none text-white tracking-tight">familia Machuka</h1>
                    <p id="userPresenceSub" class="text-xs text-teal-400 font-semibold mt-1">Conectando y obteniendo GPS...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="statusStar" class="text-emerald-400 text-3xl transition-all duration-300 drop-shadow-md">
                    <i class="fa-solid fa-star"></i>
                </span>
            </div>
        </div>
    </header>

    <!-- Contenido -->
    <main class="max-w-2xl w-full mx-auto flex-1 flex flex-col p-3 md:p-4 gap-3">

        <!-- Selector de Conversación -->
        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700/70 shadow-sm flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
            <label for="chatSelect" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 pl-1">
                <i class="fa-solid fa-comments text-teal-400 text-sm"></i> Chat:
            </label>
            <div class="relative flex-1">
                <select id="chatSelect" onchange="cambiarDestinoChat(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-100 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 appearance-none cursor-pointer">
                    <option value="general">🌐 Grupo General (Todos ven)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Botón Cena -->
        <div class="w-full">
            <button id="btnAvisarCena" onclick="avisarCena()" class="w-full bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center gap-2 text-base tracking-wide border border-red-500/40 active:scale-[0.99]">
                <span class="text-xl">🍲</span> ¡Ya esta la cena!
            </button>
        </div>

        <!-- Banner Alerta -->
        <div id="bannerCena" class="hidden alert-dinner-active text-white p-4 rounded-2xl shadow-2xl border-2 border-red-300 text-center font-black text-lg sm:text-xl tracking-wider flex items-center justify-center gap-3">
            <span class="text-2xl">🚨</span> ¡YA ESTA LA CENA! <span class="text-2xl">🚨</span>
        </div>

        <!-- Barra Estado -->
        <div class="bg-slate-800/90 border border-slate-700/60 rounded-xl px-3.5 py-2 text-xs font-mono flex justify-between items-center">
            <span id="connectionStatus" class="text-emerald-400 font-semibold">Estado: Conectado.</span>
            <span id="chatIndicatorBadge" class="text-xs bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-md font-sans">Modo: Grupo General</span>
        </div>

        <!-- Ventana Chat -->
        <div id="chatMessages" class="flex-1 bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 overflow-y-auto max-h-[52vh] min-h-[320px] flex flex-col gap-3 shadow-inner">
            <div class="text-center text-xs text-slate-500 my-auto font-medium">Cargando mensajes...</div>
        </div>

        <!-- Formulario -->
        <form id="chatForm" onsubmit="enviarMensaje(event)" class="flex gap-2 items-center bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-xl">
            <input type="text" id="usernameInput" placeholder="Tu Nombre" class="w-1/3 min-w-[100px] bg-slate-900 border border-slate-700 text-slate-100 text-sm font-semibold rounded-xl px-3 py-2.5 focus:outline-none focus:border-teal-500">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." required class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-teal-500">
            <button type="submit" class="bg-teal-500 hover:bg-teal-400 active:bg-teal-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition duration-150 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-paper-plane text-base"></i>
            </button>
        </form>

    </main>

    <script>
        const firebaseConfig = {
            databaseURL: "https://chatfamilia-386df-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Sistema de Audio Dual: Intenta reproducir tu archivo 'tonoalerta.mpeg' y si falla, usa el sintetizador web de respaldo
        const audioFile = new Audio('tonoalerta.mpeg');
        let audioCtx = null;

        function reproducirAlertaSonora() {
            // Intentar reproducir tu archivo mpeg
            audioFile.currentTime = 0;
            audioFile.play().catch(err => {
                console.log("Archivo mpeg bloqueado o no compatible, usando sintetizador de respaldo...", err);
                dispararSintetizadorRespaldo();
            });
        }

        function dispararSintetizadorRespaldo() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                
                // Primer golpe de timbre
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                gain1.gain.setValueAtTime(0.5, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.2);

                // Segundo golpe de timbre
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.2);
                gain2.gain.setValueAtTime(0.5, now + 0.2);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.2);
                osc2.stop(now + 0.5);
            } catch (e) {
                console.log("Error en sintetizador de respaldo:", e);
            }
        }

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')
                .then((reg) => {
                    console.log('Service Worker registrado con éxito:', reg.scope);
                })
                .catch((err) => {
                    console.log('Error al registrar Service Worker:', err);
                });
        }

        // Desbloquear audio y permisos al primer toque en la pantalla
        document.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            audioFile.play().then(() => {
                audioFile.pause();
                audioFile.currentTime = 0;
            }).catch(e => {});

            if (Notification.permission === 'default') {
                Notification.requestPermission().then((permission) => {
                    if (permission === 'granted') {
                        console.log('Permiso de notificaciones concedido.');
                    }
                });
            }
        }, { once: true });

        let miNombre = localStorage.getItem("chat_username");

        if (!miNombre || miNombre === "Andy ml") {
            let nombreIngresado = prompt("¡Bienvenido a Familia Machuka! Ingresa tu nombre para identificarte en el chat:");
            if (nombreIngresado && nombreIngresado.trim() !== "") {
                miNombre = nombreIngresado.trim();
            } else {
                miNombre = "Familiar_" + Math.floor(Math.random() * 900 + 100);
            }
            localStorage.setItem("chat_username", miNombre);
        }

        let destinoActual = "general";
        let totalMensajesPrevios = 0; 
        let esPrimeraCargaHistorial = true;
        let listaFamiliaresConectados = [];
        let miUbicacionActual = { lat: null, lng: null };
        
        const bodyApp = document.getElementById("bodyApp");
        const inputNombre = document.getElementById("usernameInput");
        const chatContainer = document.getElementById("chatMessages");
        const statusText = document.getElementById("connectionStatus");
        const userPresenceSub = document.getElementById("userPresenceSub");
        const statusStar = document.getElementById("statusStar");
        const bannerCena = document.getElementById("bannerCena");
        const chatSelect = document.getElementById("chatSelect");
        const chatIndicatorBadge = document.getElementById("chatIndicatorBadge");

        inputNombre.value = miNombre;

        function limpiarNombre(nombre) {
            return nombre.trim().replace(/[.#$\/\[\]]/g, "_");
        }

        // Geolocalización GPS automática
        function iniciarGeolocalizacion() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        miUbicacionActual = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        registrarPresenciaYEscuchar();
                    },
                    (error) => {
                        console.log("GPS no disponible:", error.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            }
        }

        inputNombre.addEventListener("change", (e) => {
            const limpio = limpiarNombre(e.target.value);
            if (limpio && limpio !== limpiarNombre(miNombre)) {
                database.ref("presencia/" + limpiarNombre(miNombre)).remove();
                miNombre = limpio;
                localStorage.setItem("chat_username", miNombre);
                registrarPresenciaYEscuchar();
            }
        });

        const connectedRef = database.ref(".info/connected");
        let miPresenciaRef = null;

        connectedRef.on("value", (snap) => {
            if (snap.val() === true) {
                statusText.innerText = "Estado: Conectado (GPS Activo).";
                statusText.className = "text-emerald-400 font-semibold";
                statusStar.className = "text-emerald-400 text-3xl transition-all duration-300 drop-shadow-md";
                iniciarGeolocalizacion();
            } else {
                statusText.innerText = "Estado: Desconectado.";
                statusText.className = "text-amber-400 font-semibold";
                statusStar.className = "text-amber-500 text-3xl opacity-50";
            }
        });

        function registrarPresenciaYEscuchar() {
            const nombreKey = limpiarNombre(miNombre);
            miPresenciaRef = database.ref("presencia/" + nombreKey);
            miPresenciaRef.set({ 
                nombre: miNombre, 
                online: true, 
                latitud: miUbicacionActual.lat, 
                longitud: miUbicacionActual.lng,
                ultimoAcceso: Date.now() 
            });
            miPresenciaRef.onDisconnect().remove();
        }

        database.ref("presencia").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                listaFamiliaresConectados = [];
                Object.keys(data).forEach(key => {
                    const info = data[key];
                    if (info && info.nombre) {
                        listaFamiliaresConectados.push(info.nombre);
                    }
                });

                const outros = listaFamiliaresConectados.filter(n => limpiarNombre(n) !== limpiarNombre(miNombre));
                if (outros.length === 0) {
                    userPresenceSub.innerText = "Esperando a otros familiares...";
                } else {
                    userPresenceSub.innerText = `En línea (${listaFamiliaresConectados.length}): ${listaFamiliaresConectados.join(", ")}`;
                }

                actualizarSelectorPrivados(listaFamiliaresConectados);
            } else {
                listaFamiliaresConectados = [];
                userPresenceSub.innerText = "Esperando a otros familiares...";
                actualizarSelectorPrivados([]);
            }
        });

        function actualizarSelectorPrivados(nombres) {
            const valorPrevio = chatSelect.value;
            let opcionesHTML = `<option value="general">🌐 Grupo General (Todos ven)</option>`;
            
            nombres.forEach(nombre => {
                if (limpiarNombre(nombre) !== limpiarNombre(miNombre)) {
                    const idPrivado = [limpiarNombre(miNombre), limpiarNombre(nombre)].sort().join("_to_");
                    opcionesHTML += `<option value="privado_${idPrivado}">🔒 Privado con: ${nombre}</option>`;
                }
            });

            chatSelect.innerHTML = opcionesHTML;
            if ([...chatSelect.options].some(opt => opt.value === valorPrevio)) {
                chatSelect.value = valorPrevio;
            } else {
                chatSelect.value = "general";
                destinoActual = "general";
            }
        }

        let listenerChat = null;

        function dispararFlashRojo() {
            bodyApp.classList.remove('flash-rojo-activo');
            void bodyApp.offsetWidth; 
            bodyApp.classList.add('flash-rojo-activo');
            setTimeout(() => { bodyApp.classList.remove('flash-rojo-activo'); }, 2400); // 6 destellos
        }

        function escucharConversacion(destino) {
            if (listenerChat) listenerChat.off();

            chatContainer.innerHTML = '<div class="text-center text-xs text-slate-500 my-auto">Cargando mensajes...</div>';
            
            let rutaFirebase = destino === "general" ? "chats_grupo/general" : `chats_privados/${destino.replace("privado_", "")}`;
            
            if (destino === "general") {
                chatIndicatorBadge.innerText = "Modo: Grupo General";
                chatIndicatorBadge.className = "text-xs bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-md font-sans";
            } else {
                chatIndicatorBadge.innerText = "Modo: Chat Privado 🔒";
                chatIndicatorBadge.className = "text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-md font-sans";
            }

            listenerChat = database.ref(rutaFirebase);
            esPrimeraCargaHistorial = true;

            listenerChat.limitToLast(60).on("value", (snapshot) => {
                chatContainer.innerHTML = "";
                const mensajes = snapshot.val();

                if (!mensajes) {
                    chatContainer.innerHTML = '<div class="text-center text-xs text-slate-500 my-auto">No hay mensajes aún en este chat. ¡Escribe el primero!</div>';
                    totalMensajesPrevios = 0;
                    esPrimeraCargaHistorial = false;
                    return;
                }

                const listaMensajes = Object.values(mensajes);
                const cantidadActual = listaMensajes.length;

                if (!esPrimeraCargaHistorial && cantidadActual > totalMensajesPrevios) {
                    const ultimoMensaje = listaMensajes[listaMensajes.length - 1];
                    if (ultimoMensaje && ultimoMensaje.usuario !== miNombre) {
                        reproducirAlertaSonora();
                        dispararFlashRojo();
                    }
                }

                totalMensajesPrevios = cantidadActual;
                esPrimeraCargaHistorial = false;

                listaMensajes.forEach((msg) => {
                    const esMio = msg.usuario === miNombre;
                    const msgDiv = document.createElement("div");
                    msgDiv.className = `flex flex-col ${esMio ? "items-end" : "items-start"}`;

                    const fecha = new Date(msg.timestamp || Date.now());
                    const hora = fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    msgDiv.innerHTML = `
                        <div class="max-w-[85%] rounded-2xl px-4 py-2.5 ${esMio ? "bg-teal-600 text-white rounded-br-none" : "bg-slate-700/90 text-slate-100 rounded-bl-none"} shadow-sm">
                            ${!esMio ? `<div class="text-[11px] font-bold text-teal-400 mb-0.5">${escapeHTML(msg.usuario || 'Familiar')}</div>` : ''}
                            <div class="text-sm leading-relaxed">${escapeHTML(msg.texto || '')}</div>
                            <div class="text-[9px] text-right mt-1 opacity-70">${hora}</div>
                        </div>
                    `;
                    chatContainer.appendChild(msgDiv);
                });

                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function cambiarDestinoChat(nuevoDestino) {
            destinoActual = nuevoDestino;
            escucharConversacion(destinoActual);
        }

        function enviarMensaje(e) {
            e.preventDefault();
            const inputMsg = document.getElementById("messageInput");
            const texto = inputMsg.value.trim();
            if (!texto) return;

            let rutaFirebase = destinoActual === "general" ? "chats_grupo/general" : `chats_privados/${destinoActual.replace("privado_", "")}`;

            database.ref(rutaFirebase).push({
                usuario: miNombre,
                texto: texto,
                timestamp: Date.now()
            });

            inputMsg.value = "";
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function avisarCena() {
            database.ref('sistema/aviso_cena').set({ activo: true, timestamp: Date.now(), enviadoPor: miNombre });
            setTimeout(() => { database.ref('sistema/aviso_cena').set({ activo: false }); }, 20000);
        }

        let estadoCenaAnterior = false;
        database.ref('sistema/aviso_cena').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.activo) {
                bannerCena.classList.remove('hidden');
                if (!estadoCenaAnterior && data.enviadoPor !== miNombre) {
                    reproducirAlertaSonora();
                    dispararFlashRojo();
                    
                    if (Notification.permission === 'granted') {
                        new Notification("🚨 ¡YA ESTA LA CENA!", {
                            body: "¡Corre a la mesa! Alerta de Familia Machuka.",
                            icon: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/house-chimney.svg"
                        });
                    }
                }
                estadoCenaAnterior = true;
            } else {
                bannerCena.classList.add('hidden');
                estadoCenaAnterior = false;
            }
        });

        window.onload = () => {
            escucharConversacion(destinoActual);
        };
    </script>
</body>
</html>
